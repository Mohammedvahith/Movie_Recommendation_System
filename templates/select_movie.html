<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Movie</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Modal container */
        .modal {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 700px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h2 {
            font-size: 26px;
            margin-bottom: 20px;
        }

        .movies-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .card {
            width: 160px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(255, 75, 43, 0.5);
        }

        .card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .card img:hover {
            transform: scale(1.05);
        }

        .title {
            font-weight: bold;
            margin: 8px 0 4px 0;
            font-size: 14px;
        }

        .meta {
            font-size: 12px;
            color: #ccc;
            margin-bottom: 10px;
        }

        button {
            padding: 8px 12px;
            margin-bottom: 12px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border: none;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 75, 43, 0.6);
        }

        /* Optional: Add a background fade effect */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: -1;
        }

        @media (max-width: 480px) {
            .card {
                width: 45%;
            }

            .card img {
                height: 200px;
            }
        }
    </style>
</head>

<body>
    <div class="modal">
        <h2>Select the correct movie</h2>
        <p class="tagline">Find the exact movie you’re looking for before getting recommendations.</p>
        <div class="movies-grid">
            {% for movie in matches %}
            <div class="card">
                <img src="{{ movie.poster }}" alt="{{ movie.title }}">
                <div class="title">{{ movie.title }}</div>
                <div class="meta">{{ movie.release_date[:4] }} | {{ movie.language }}</div>
                <form method="POST" action="/recommend_by_id">
                    <input type="hidden" name="movie_id" value="{{ movie.id }}">
                    <input type="hidden" name="movie_title" value="{{ movie.title }}">
                    <input type="hidden" name="num_recommendations" value="{{ request.form.num_recommendations }}">
                    <button type="submit">Select</button>
                </form>
            </div>
            {% endfor %}
        </div>
    </div>
</body>

</html>
