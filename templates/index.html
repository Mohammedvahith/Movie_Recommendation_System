<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommender</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            padding: 35px;
            border-radius: 20px;
            width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 25px;
        }

        label {
            display: block;
            text-align: left;
            font-size: 14px;
            margin-bottom: 5px;
        }

        input {
            padding: 12px;
            border-radius: 10px;
            border: none;
            margin-bottom: 18px;
            width: 100%;
            box-sizing: border-box;
            background: rgba(255,255,255,0.15);
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input::placeholder {
            color: #ddd;
        }

        input:focus {
            background: rgba(255,255,255,0.25);
        }

        button {
            padding: 12px;
            width: 100%;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 75, 43, 0.7);
        }

        .error {
            margin-top: 15px;
            color: #ff6b6b;
        }

        /* Loading effect */
        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        /* Optional: Add a background fade effect */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: -1;
        }

        @media (max-width: 480px) {
            .container {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🎬 Movie Recommender</h1>
        <p class="tagline">Discover movies you'll love instantly</p>

        <form method="POST" action="/recommend" onsubmit="handleSubmit(this)">
            
            <label>Enter a movie title</label>
            <input type="text" name="movie_title" placeholder="e.g. Inception" required>

            <label>Number of recommendations</label>
            <input type="number" name="num_recommendations" min="1" max="10" value="4">

            <button type="submit" id="submitBtn">Get Recommendations</button>
        </form>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
    </div>

    <script>
        function handleSubmit(form) {
            const btn = document.getElementById("submitBtn");
            btn.innerText = "Loading...";
            btn.disabled = true;
            form.classList.add("loading");
        }
    </script>

</body>

</html>
